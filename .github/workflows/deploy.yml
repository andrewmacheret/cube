name: Build and deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/canary.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  S3_PATH: s3://andrewmacheret.com/projects/cube

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # Everything under projects/cube comes from this repo, so --delete is safe.
      # Files in assets/ have a content hash in their name, so they can be cached forever.
      - name: Upload to S3
        run: |
          aws s3 sync dist "$S3_PATH" --delete --exclude index.html --exclude cube2.png --exclude 'healthcheck/*' \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp dist/cube2.png "$S3_PATH/cube2.png" --cache-control 'public, max-age=86400'
          aws s3 cp dist/index.html "$S3_PATH/index.html" --cache-control 'no-cache'
          aws s3 sync dist/healthcheck "$S3_PATH/healthcheck" --delete --cache-control 'no-cache'
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/projects/cube/*'
